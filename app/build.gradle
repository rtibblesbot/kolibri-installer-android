plugins {
	id 'com.android.application'
	id 'com.chaquo.python'
	id 'com.diffplug.spotless'
}

spotless {
	java {
		target 'src/*/java/**/*.java'
		googleJavaFormat('1.19.2')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
	groovyGradle {
		target '*.gradle'
		greclipse()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

import org.gradle.api.tasks.*
import javax.inject.Inject

// Task to extract and patch Kolibri tar file (replicates Makefile install-tar)
abstract class PatchKolibriTask extends DefaultTask {
	@InputFile
	abstract RegularFileProperty getTarFile()

	@OutputDirectory
	abstract DirectoryProperty getPatchedDir()

	@Inject
	abstract ExecOperations getExecOperations()

	@TaskAction
	void patchKolibri() {
		def tarFile = getTarFile().get().asFile
		def patchedDir = getPatchedDir().get().asFile

		if (!tarFile.exists()) {
			throw new GradleException("Kolibri tar file not found: ${tarFile}")
		}

		println "Patching Kolibri from ${tarFile.name}"

		// Clean and create patched directory
		if (patchedDir.exists()) {
			patchedDir.deleteDir()
		}
		patchedDir.mkdirs()

		// Extract tar file, excluding problematic packages
		execOperations.exec {
			commandLine 'tar', 'xzf', tarFile.absolutePath,
					'--exclude=kolibri/dist/py2only*',
					'--exclude=kolibri/dist/cext/*',
					'--exclude=kolibri/dist/ifaddr*',
					'--directory=' + patchedDir.absolutePath,
					'--strip-components=1'
		}

		// Patch Django to allow .pyc migration files
		// This is critical because Chaquopy compiles .py files and deletes them
		def djangoLoader = new File(patchedDir, 'kolibri/dist/django/db/migrations/loader.py')
		if (djangoLoader.exists()) {
			def content = djangoLoader.text
			content = content.replace(
					'if name.endswith(".py"):',
					'if name.endswith(".py") or name.endswith(".pyc"):'
					)
			djangoLoader.text = content
			println "Patched Django migrations loader"
		} else {
			throw new GradleException("Could not find Django loader.py to patch")
		}

		println "Kolibri patched successfully at ${patchedDir.absolutePath}"
	}
}

tasks.register('patchKolibriTar', PatchKolibriTask) {
	def tarFile = file('../tar').listFiles()?.find { it.name.endsWith('.tar.gz') && it.name.startsWith('kolibri') }
	getTarFile().set(tarFile)
	getPatchedDir().set(file('../tar/patched'))
}

// Determine which Python to use for build scripts
def buildPythonExecutable = 'python3'  // Default
def venvPython = file('../.venv/bin/python3')
if (venvPython.exists()) {
	buildPythonExecutable = venvPython.absolutePath
}

// Ensure Kolibri tar is patched during configuration phase
// This is necessary so version can be calculated before tasks run
def patchedKolibriDir = file('../tar/patched')
def tarFile = file('../tar').listFiles()?.find { it.name.endsWith('.tar.gz') && it.name.startsWith('kolibri') }

if (tarFile != null && tarFile.exists() && !new File(patchedKolibriDir, 'kolibri/VERSION').exists()) {
	println "Extracting and patching Kolibri tar during configuration..."

	// Clean and create patched directory
	if (patchedKolibriDir.exists()) {
		patchedKolibriDir.deleteDir()
	}
	patchedKolibriDir.mkdirs()

	// Extract tar file, excluding problematic packages
	exec {
		commandLine 'tar', 'xzf', tarFile.absolutePath,
				'--exclude=kolibri/dist/py2only*',
				'--exclude=kolibri/dist/cext/*',
				'--exclude=kolibri/dist/ifaddr*',
				'--directory=' + patchedKolibriDir.absolutePath,
				'--strip-components=1'
	}

	// Patch Django to allow .pyc migration files
	def djangoLoader = new File(patchedKolibriDir, 'kolibri/dist/django/db/migrations/loader.py')
	if (djangoLoader.exists()) {
		def content = djangoLoader.text
		content = content.replace(
				'if name.endswith(".py"):',
				'if name.endswith(".py") or name.endswith(".pyc"):'
				)
		djangoLoader.text = content
		println "Patched Django migrations loader"
	}

	println "Kolibri patched successfully"
}

// Calculate version name and code
def calculatedVersionName
def calculatedVersionCode

if (patchedKolibriDir.exists() && patchedKolibriDir.isDirectory()) {
	// Read VERSION_NAME from Kolibri's VERSION file
	def kolibriVersionFile = new File(patchedKolibriDir, 'kolibri/VERSION')
	if (!kolibriVersionFile.exists()) {
		throw new GradleException("Kolibri VERSION file not found at: ${kolibriVersionFile}")
	}

	def kolibriVersion = kolibriVersionFile.text.trim()
	def androidInstallerVersion = "0.1.7"
	def buildType = System.getenv("RELEASE_KEYALIAS") == "LE_RELEASE_KEY" ? "official" :
			System.getenv("RELEASE_KEYALIAS") == "LE_DEV_KEY" ? "dev" : "debug"
	calculatedVersionName = "${kolibriVersion}-${androidInstallerVersion}-${buildType}"

	// Get VERSION_CODE
	if (buildType == "official") {
		// Production builds: MUST use Python script to query Play Store API
		println "Official build: getting version code from Play Store API..."
		def output = new ByteArrayOutputStream()
		exec {
			workingDir projectDir.parent
			commandLine 'bash', '-c', "${buildPythonExecutable} scripts/version.py"
			standardOutput = output
		}
		calculatedVersionCode = output.toString().trim() as int
	} else {
		// Dev/debug builds: use timestamp-based version code
		def buildBaseNumber = 2008998000L
		def now = new Date()
		def timestamp = now.format('yyMMddHHmm') as long
		calculatedVersionCode = (timestamp - buildBaseNumber) as int
	}

	println "Generated version: ${calculatedVersionName} (code: ${calculatedVersionCode})"
} else {
	// Patched Kolibri doesn't exist yet - use defaults for initial Gradle sync
	calculatedVersionName = '0.0.1-dev'
	calculatedVersionCode = 1
	println "Using default version (build Kolibri tar first for correct version)"
}

// Task to generate Android resource strings from Kolibri translations
abstract class GenerateKolibriStringsTask extends DefaultTask {
	@InputFile
	abstract RegularFileProperty getScriptFile()

	@Input
	abstract Property<String> getVersionText()

	@Input
	abstract Property<String> getPythonExecutable()

	@OutputDirectory
	abstract DirectoryProperty getResDir()

	@Inject
	abstract ExecOperations getExecOperations()

	@TaskAction
	void generateStrings() {
		println "Generating Kolibri strings..."

		def projectRoot = getScriptFile().get().asFile.parentFile.parentFile
		def versionText = getVersionText().get()
		def pythonExe = getPythonExecutable().get()

		execOperations.exec {
			workingDir projectRoot
			commandLine 'bash', '-c', "${pythonExe} scripts/create_strings.py '${versionText}'"
		}

		println "Kolibri strings generated successfully"
	}
}

tasks.register('generateKolibriStrings', GenerateKolibriStringsTask) {
	dependsOn patchKolibriTar
	getScriptFile().set(file('../scripts/create_strings.py'))
	getResDir().set(file('src/main/res'))
	// Version text input is sufficient - when it changes, task reruns
	getVersionText().set(calculatedVersionName)
	getPythonExecutable().set(buildPythonExecutable)
}

// Make sure Kolibri is patched before Python requirements are generated
afterEvaluate {
	tasks.matching { task ->
		task.name.contains('PythonRequirements') ||
				task.name.contains('extractPythonBuildPackages')
	}.all { task ->
		task.dependsOn patchKolibriTar
	}

	// Generate strings before resources are processed or mapped
	tasks.matching { task ->
		task.name.contains('generateDebugResources') ||
				task.name.contains('generateReleaseResources') ||
				task.name.contains('mergeDebugResources') ||
				task.name.contains('mergeReleaseResources') ||
				task.name.contains('mapDebugSourceSetPaths') ||
				task.name.contains('mapReleaseSourceSetPaths') ||
				task.name.contains('extractDeepLinksDebug') ||
				task.name.contains('extractDeepLinksRelease')
	}.all { task ->
		task.dependsOn generateKolibriStrings
	}
}

android {
	namespace = 'org.learningequality.Kolibri'
	compileSdk = 35
	buildToolsVersion = "35.0.0"

	// Use calculated version from configuration phase
	def code = calculatedVersionCode
	def name = calculatedVersionName

	// Strip -debug-debug for debug builds
	def nameNoDebug = name.replace("-debug", "")

	defaultConfig {
		applicationId = "org.learningequality.Kolibri"
		minSdk = 24  // Chaquopy requires API 24+
		targetSdk = 35
		versionCode = code
		versionName = name
		multiDexEnabled = true
		base.archivesName = "kolibri-$nameNoDebug"

		ndk {
			// ARM for mobile devices, x86_64 for Chromebooks and emulators
			// x86 (32-bit) dropped - legacy emulators only
			abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
		}

		python {
			version = "3.10"

			// Use the same Python as our build scripts (venv if available, else system)
			buildPython buildPythonExecutable

			pip {
				// Install Kolibri from patched tar file
				// The patchKolibriTar task extracts and patches the tar before this runs
				install "../tar/patched"
				install "-r", "../requirements.txt"
			}
		}
	}

	packagingOptions {
		jniLibs {
			useLegacyPackaging = true
		}
		resources {
			excludes += [
				'lib/**/gdbserver',
				'lib/**/gdb.setup'
			]
		}
	}

	signingConfigs {
		release {
			storeFile file(System.getenv("RELEASE_KEYSTORE") ?: "empty")
			keyAlias System.getenv("RELEASE_KEYALIAS") ?: ""
			storePassword System.getenv("RELEASE_KEYSTORE_PASSWD") ?: ""
			keyPassword System.getenv("RELEASE_KEYALIAS_PASSWD") ?: ""
		}
	}

	buildTypes {
		debug {
			debuggable = true
		}
		release {
			signingConfig = signingConfigs.release
			minifyEnabled false
		}
	}

	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_11
		targetCompatibility = JavaVersion.VERSION_11
	}

	testOptions {
		unitTests {
			returnDefaultValues = true
		}
	}

	buildFeatures {
		buildConfig = true
	}

	androidResources {
		noCompress 'tflite'
	}

	sourceSets {
		main {
			python {
				srcDir "src/main/python"
			}
		}
	}
}

dependencies {
	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'androidx.annotation:annotation:1.9.1'
	implementation 'androidx.concurrent:concurrent-futures:1.3.0'
	implementation 'androidx.work:work-runtime:2.11.0'
	implementation 'androidx.work:work-multiprocess:2.11.0'
	implementation 'androidx.lifecycle:lifecycle-service:2.10.0'
	implementation 'androidx.multidex:multidex:2.0.1'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.16'
	testImplementation 'org.mockito:mockito-core:5.21.0'
}
